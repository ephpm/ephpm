# E2E tests - bare-process default.
#
# Spawns ephpm binaries directly on 127.0.0.1 (no Kind, no Tilt, no
# `--privileged` DinD in the CI path) and runs the ephpm-e2e test binaries
# against them. Matrix: PHP 8.3, 8.4, 8.5. See `xtask/src/e2e_bare.rs`.
#
# The old Kind + Tilt harness lives at .github/workflows/k8s-e2e.yml as an
# opt-in workflow_dispatch job for engineers who want to smoke K8s deploy
# shape before checking in code that touches k8s/.

name: E2E Tests

# Docs-only changes skip E2E (unchanged from the Kind era).
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"
  pull_request:
    # `main` plus long-lived feature branches that other PRs stack onto -- see
    # the matching note in ci.yml. A PR targeting a stacked branch otherwise
    # gets no E2E coverage at all.
    branches: [main, "feat/**"]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"

# NOTE: no `concurrency` group. Bare-process runs are independent - each job
# spawns ephpm processes on high, per-run loopback ports and cleans up on exit.
# Multiple E2E runs can share the runner without stepping on each other, and
# the matrix legs can run in parallel.

jobs:
  e2e-bare:
    name: E2E bare-process (PHP ${{ matrix.php }})
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.5", "8.4"]

    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        # See ci.yml: some fleet runners are root without `sudo`, so a bare
        # `sudo apt-get` exits 127 and fails the leg in seconds.
        run: |
          set -eu
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "apt-get unavailable; assuming the image already provides build prerequisites"
            exit 0
          fi
          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            echo "::error::not running as root and sudo is unavailable"
            exit 1
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends build-essential libclang-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable

      - name: Run bare-process E2E
        run: cargo xtask e2e --php-version ${{ matrix.php }}
