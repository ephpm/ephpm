name: Turso Pin Watch

# Keeps ePHPm's exact `turso = "=X.Y.Z"` pin in step with crates.io — but turso
# is special: ePHPm cannot bump it alone. The version is chosen by litewire, and
# ePHPm's pin exists only so both resolve to ONE turso crate instance (litewire's
# re-exported `TursoConnection` must be the same `turso::Connection`). A bump
# moves TWO pins together — the litewire git `rev` and the turso version — and
# litewire has to carry the new turso first.
#
# So this watcher is a HYBRID:
#   - litewire ALREADY on the new turso  -> open a real bump PR here
#     (litewire rev + turso pin together, `cargo update`, CI verifies the single
#      instance). This is the common case once litewire's own turso-pin-watch PR
#     has merged.
#   - litewire NOT yet on it              -> litewire is the blocker, which no
#     ePHPm PR can fix, so fall back to the single reused tracking ISSUE that
#     spells out the two-repo chain. The PR path takes over automatically on the
#     next run after litewire catches up.
#
# Idempotent: one `bump/turso-<ver>` branch per version for the PR path; one
# open issue (label `turso-pin`) for the fallback. Opening the PR closes the
# fallback issue.
#
# Token note: PRs opened with the default GITHUB_TOKEN do NOT trigger CI
# (GitHub's recursion guard) — close/reopen or push to get a run.

on:
  schedule:
    # Daily, 06:43 UTC — shortly after litewire's own turso watcher (06:13), so
    # a litewire merge is picked up here within a day.
    - cron: "43 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact turso version to target (e.g. 0.8.0). Empty = latest stable on crates.io."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: turso-pin-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - name: Reconcile the turso pin against crates.io and litewire
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: turso-pin
          LITEWIRE: ephpm/litewire
          EXPLICIT_VERSION: ${{ inputs.version || '' }}
          UA: "ephpm-turso-pin-watch (+https://github.com/ephpm/ephpm)"
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          pin_re='s/^[[:space:]]*turso[[:space:]]*=[[:space:]]*\{[^}]*version[[:space:]]*=[[:space:]]*"=?([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p'

          # ── 1. Target turso: explicit input, or latest stable ────────────
          if [ -n "$EXPLICIT_VERSION" ]; then
            latest="$EXPLICIT_VERSION"
          else
            api=$(curl -fsSL --retry 3 --retry-delay 5 -H "User-Agent: $UA" \
                    https://crates.io/api/v1/crates/turso) || fail "crates.io query failed"
            latest=$(jq -r '.crate.max_stable_version // empty' <<<"$api")
          fi
          [ -n "$latest" ] || fail "no target version resolved"
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$latest" || fail "target not semver: '$latest'"

          # ── 2. ePHPm's current turso pin + litewire rev ──────────────────
          current=$(sed -nE "$pin_re" Cargo.toml | head -1)
          [ -n "$current" ] || fail "could not parse the turso pin from ephpm Cargo.toml"
          rev=$(sed -nE 's/^[[:space:]]*litewire[[:space:]]*=[[:space:]]*\{[^}]*rev[[:space:]]*=[[:space:]]*"([0-9a-f]+)".*/\1/p' Cargo.toml | head -1)
          [ -n "$rev" ] || fail "could not parse the litewire rev from ephpm Cargo.toml"
          echo "ephpm: turso=$current litewire_rev=$rev ; target turso=$latest"

          # ── 3. Already on the latest stable turso? (never downgrade) ─────
          if [ "$current" = "$latest" ] \
             || [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" != "$latest" ]; then
            echo "ePHPm turso pin $current is up to date (crates.io stable: $latest)"; exit 0
          fi
          echo "::notice::turso $latest is newer than ePHPm's pinned $current"

          # ── 4. Is litewire ready? (main's turso pin == target) ───────────
          lhead=$(gh api "repos/${LITEWIRE}/commits/HEAD" --jq '.sha') || fail "litewire HEAD query failed"
          lturso=$(gh api "repos/${LITEWIRE}/contents/Cargo.toml" --jq '.content' \
                    | base64 -d | sed -nE "$pin_re" | head -1)
          [ -n "$lturso" ] || fail "could not parse litewire's turso pin"
          lshort="${lhead:0:12}"
          echo "litewire: HEAD=$lshort turso=$lturso"

          # ══ PR PATH — litewire already carries the new turso ═════════════
          if [ "$lturso" = "$latest" ]; then
            branch="bump/turso-${latest}"
            if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq length)" != "0" ]; then
              echo "open PR from ${branch} already exists — nothing to do"; exit 0
            fi
            if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "branch ${branch} already exists on origin — nothing to do"; exit 0
            fi

            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B "$branch" origin/main

            # Move BOTH pins together: litewire rev -> litewire HEAD, turso -> target.
            sed -i -E \
              's|^([[:space:]]*litewire[[:space:]]*=[[:space:]]*\{[^}]*rev[[:space:]]*=[[:space:]]*")[0-9a-f]+(".*)|\1'"${lshort}"'\2|' \
              Cargo.toml
            sed -i -E \
              's/^([[:space:]]*turso[[:space:]]*=[[:space:]]*\{[^}]*version[[:space:]]*=[[:space:]]*")=?[0-9]+\.[0-9]+\.[0-9]+(".*)/\1='"${latest}"'\2/' \
              Cargo.toml
            grep -q "\"=${latest}\"" Cargo.toml || fail "turso pin not updated to =${latest}"
            grep -q "\"${lshort}\"" Cargo.toml   || fail "litewire rev not updated to ${lshort}"

            delta=$(cargo update -p litewire -p turso -p turso_core 2>&1) \
              || fail "cargo update (litewire/turso/turso_core) failed"
            echo "$delta"

            git add Cargo.toml Cargo.lock
            git commit -q -m "deps: bump turso ${current} -> ${latest} (litewire rev -> ${lshort})" \
              || fail "nothing to commit"
            git push origin "$branch" || fail "pushing ${branch} failed"

            body_file=$(mktemp)
            {
              echo "Automated **two-pin** turso bump — litewire is already on \`${latest}\`."
              echo
              echo "- turso: \`${current}\` → \`${latest}\`"
              echo "- litewire rev: \`${rev}\` → \`${lshort}\` (ephpm/litewire@\`${lshort}\`, whose \`turso\` pin is \`${latest}\`)"
              echo
              echo "Both pins MUST move together — bumping only one resolves two turso"
              echo "instances and breaks the CDC/backend types. \`cargo update -p litewire"
              echo "-p turso -p turso_core\` delta:"
              echo '```'
              echo "$delta"
              echo '```'
              echo
              echo "### Review before merge"
              echo "- [ ] CI green — the single-instance guard"
              echo "      (\`crates/ephpm-server/tests/tls_single_crypto_provider.rs\` is TLS;"
              echo "      the turso instance is validated by the CDC/backend build itself)."
              echo "- [ ] turso changelog checked for CDC / vtab-TVF / PRAGMA changes —"
              echo "      \`turso_cdc.rs\` and \`db_bridge.rs\` track these (see CLAUDE.md)."
              echo "- [ ] The litewire rev advance to main HEAD carries no unwanted change."
              echo
              echo "<sub>Opened by \`.github/workflows/turso-pin-watch.yml\` (PR path). Auto-PR"
              echo "only. Default-token PRs do not trigger CI; close/reopen to get a run.</sub>"
            } > "$body_file"

            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "deps: bump turso ${current} -> ${latest}" --body-file "$body_file" \
              || fail "opening PR failed"
            echo "::notice::opened turso bump PR for ${latest}"

            # Supersede the fallback tracking issue, if one is open.
            iss=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open \
                   --json number --jq '.[0].number // empty')
            if [ -n "$iss" ]; then
              gh issue comment "$iss" --repo "$GITHUB_REPOSITORY" \
                --body "Superseded by the automated bump PR (litewire is now on turso ${latest}). Closing."
              gh issue close "$iss" --repo "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi

          # ══ ISSUE PATH — litewire is the blocker ═════════════════════════
          echo "::notice::litewire still pins turso ${lturso}; it must bump first"
          gh label create "$LABEL" --description "Tracks a turso version bump (litewire → ephpm)" \
            --color BFD4F2 2>/dev/null || true

          title="chore(deps): turso $latest is available (ephpm pins: $current, litewire pins: $lturso)"
          body=$(cat <<EOF
          crates.io publishes **turso $latest**; ePHPm pins \`turso = "=$current"\`
          and litewire (main) pins \`turso = "=$lturso"\`. ePHPm cannot bump on its
          own — a bump moves two pins together and **litewire must go first**:

          **(a) ephpm/litewire** — its \`Turso Pin Watch\` opens a \`turso $latest\`
          bump PR automatically; review and merge it (check the CDC / vtab / PRAGMA
          surfaces). If it hasn't appeared, run that workflow via \`workflow_dispatch\`.

          **(b) ephpm/ephpm** — once litewire main is on \`$latest\`, THIS watcher
          opens the matching (litewire rev + turso pin) PR here automatically on its
          next daily run — no manual step. The two pins move together or the
          CDC/backend types break.

          <sub>Opened automatically by \`.github/workflows/turso-pin-watch.yml\`
          (issue fallback — litewire is the current blocker).</sub>
          EOF
          )

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open \
                       --json number,title --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "$LABEL" --body "$body")
            echo "::notice::opened $url"; exit 0
          fi
          existing_title=$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          if [[ "$existing_title" == *"turso $latest "* ]]; then
            echo "issue #$existing already tracks turso $latest — nothing to do"; exit 0
          fi
          gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title"
          gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          echo "::notice::updated tracking issue #$existing to turso $latest"
