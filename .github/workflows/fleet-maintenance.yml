name: Fleet Maintenance

# Manually dispatched janitorial tasks for the self-hosted runner fleet.
# First use: purge a corrupted BuildKit/containerd build cache on the
# shared Linux docker node (v0.6.3 release Docker legs failed twice on
# `parent snapshot ... does not exist` — stale cache from a fleet outage).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Maintenance task to run"
        required: true
        default: docker-cache-prune
        type: choice
        options:
          - docker-cache-prune
          - image-purge

jobs:
  docker-cache-prune:
    if: inputs.task == 'docker-cache-prune'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Purge docker build cache on this node
        run: |
          set -eux
          # The default buildx builder's container can be gone while its
          # state volume (with a corrupted snapshot db) survives — remove
          # the builder, any orphaned buildkit containers, and their state
          # volumes so the next build recreates everything fresh.
          docker buildx ls || true
          docker buildx rm -f default || true
          docker ps -aq --filter name=buildx_buildkit | xargs -r docker rm -f
          docker volume ls -q --filter name=buildx_buildkit | xargs -r docker volume rm -f
          docker builder prune -af || true
          # NOTE: no `docker system df` here — ephemerd's docker shim does
          # not implement /system/df and the job would fail on diagnostics.
          echo "cache purge complete"

  image-purge:
    if: inputs.task == 'image-purge'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Remove all images so builds re-pull fresh layers
        # For image records whose layer snapshots were GC'd out from under
        # them (ephemerd #146 disk-pressure GC): builds fail with
        # `parent snapshot sha256:... does not exist` on base-image layers.
        # Removing the image records forces a clean re-pull.
        run: |
          set -eux
          docker images -aq | sort -u | xargs -r -n1 docker rmi -f || true
          echo "image purge complete"
