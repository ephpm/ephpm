name: Release

# Release artifacts produced per tag:
#
#   * Per-platform binary archives uploaded to the GitHub release:
#       ephpm-vX.Y.Z+php<PHP_FULL>-<os>-<arch>.tar.gz   (one per PHP minor x OS/arch)
#       SHA256SUMS                                       (covers all archives)
#
#   * Docker images pushed to Docker Hub at docker.io/ephpm/ephpm:
#       :vX.Y.Z-php<PHP_FULL>     pinned ephpm release x pinned PHP patch
#       :vX.Y.Z-php<PHP_MINOR>    pinned ephpm release x rolling PHP minor
#       :<PHP_MINOR>              rolling latest release x rolling PHP minor
#       :vX.Y.Z (default PHP)     pinned ephpm release x default PHP minor
#       :latest (default PHP)     rolling latest release x default PHP minor
#
# The "+" in artifact names is real SemVer build metadata. OCI tag regex
# rejects "+", so every Docker tag substitutes "-" for "+" -- the same
# trade-off k3s and rke2 make. The real SemVer string is preserved on each
# image via the org.opencontainers.image.version label.
#
# PHP version pins must match xtask::PHP_SDK_VERSIONS -- keep the matrix
# entries below in sync if you bump a pin.

on:
  push:
    tags: ["v*"]
  # Republish path for an already-pushed tag.
  #
  # A tag-triggered run always executes the workflow file as it existed at the
  # TAGGED COMMIT -- `gh run rerun` replays the same SHA, so a workflow fix
  # merged to main afterwards does NOT reach it. When a release is stuck on a
  # CI-side (not code-side) failure, fixing release.yml on main and then
  # dispatching it here against the existing tag republishes the missing pieces
  # without deleting/moving the tag and without rebuilding the 12 binary legs.
  #
  # On dispatch the four binary build jobs are skipped: `docker-image` rebuilds
  # from the tag's source (the Dockerfile compiles ephpm itself, so it needs no
  # prior artifact), and `release` re-assembles the GitHub release from the
  # archives already attached to the original run (artifacts_run_id).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.6.1"
        required: true
        type: string
      publish:
        description: "Push images / create the release. Leave off for a build-only smoke test."
        type: boolean
        default: false
      artifacts_run_id:
        description: "Run ID holding the binary archives (required to create the release; omit for a Docker-only run)."
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # -- Linux x86_64 binaries ---------------------------------------------------
  # arm64 lives in its own job (build-linux-arm64) so it can be throttled
  # independently: the v0.5.1 release run proved that firing every leg at
  # once kills the shared hosts (all 9 non-x64 legs died mid-build with
  # "runner lost communication" / vanished-disk signatures) while the x64
  # pool handled 3 builds + 3 Docker jobs fine.
  build-linux:
    name: Build (PHP ${{ matrix.php.full }}, ${{ matrix.arch.sdk }})
    # Binary legs run only for a real tag push; the workflow_dispatch
    # republish path reuses the archives from the original run.
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    container: "ephpm/ephpm-ci:${{ matrix.arch.image }}"
    strategy:
      fail-fast: false
      matrix:
        php:
          - { minor: "8.3", full: "8.3.31" }
          - { minor: "8.4", full: "8.4.23" }
          - { minor: "8.5", full: "8.5.7" }
        arch:
          - runner: x64
            image: latest
            triple: x86_64-unknown-linux-gnu
            sdk: linux-x86_64
            lto: fat
    steps:
      - uses: actions/checkout@v4

      - name: Compute release version
        # Strip the leading "v" from the git ref name so EPHPM_RELEASE_VERSION
        # is a bare SemVer string ("v0.1.1" -> "0.1.1") matching clap's
        # default `<bin> <version>` formatting. crates/ephpm/build.rs forwards
        # this into the binary so `ephpm --version` reports the actual tag
        # instead of the frozen workspace version in Cargo.toml.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          echo "EPHPM_RELEASE_VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build ephpm
        env:
          # Overrides profile.release.lto from Cargo.toml per-arch (see the
          # matrix `lto` value). linux-x64 keeps fat LTO -- it builds fine on
          # the x64 hosts. The memory-constrained targets (linux-aarch64,
          # windows) run in their own jobs below with LTO disabled.
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.arch.lto }}
        run: cargo xtask release ${{ matrix.php.minor }}

      - name: Package archive
        id: pkg
        env:
          VERSION: ${{ github.ref_name }}
          PHP_FULL: ${{ matrix.php.full }}
        run: |
          set -eu
          name="ephpm-${VERSION}+php${PHP_FULL}-${{ matrix.arch.sdk }}"
          mkdir -p "dist/${name}"
          # cargo xtask release targets the gnu triple explicitly on Linux
          # (glibc-dynamic binary, dlopen-capable), so the binary lives under
          # target/<triple>/release/, not target/release/.
          cp "target/${{ matrix.arch.triple }}/release/ephpm" "dist/${name}/ephpm"
          cp LICENSE "dist/${name}/LICENSE"
          cp .github/release-readme.txt "dist/${name}/README.txt"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
          echo "archive=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ephpm-${{ github.ref_name }}-php${{ matrix.php.full }}-${{ matrix.arch.sdk }}
          path: ${{ steps.pkg.outputs.archive }}

  # -- Linux arm64 binaries ----------------------------------------------------
  build-linux-arm64:
    name: Build (PHP ${{ matrix.php.full }}, linux-aarch64)
    # arm64 builds run in the Apple Silicon host's embedded linux VM
    # (ephemerd dispatches `[self-hosted, linux, arm64]`) — the SAME
    # physical machine that runs build-macos natively. `needs: build-macos`
    # is the only cross-job serialization GitHub offers, and max-parallel: 1
    # keeps the VM to one heavy link at a time. Without both, the v0.5.1
    # release run put 6 concurrent release builds on that one host and every
    # runner on it died mid-build.
    needs: build-macos
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, arm64]
    container: "ephpm/ephpm-ci:latest-arm64"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        php:
          - { minor: "8.3", full: "8.3.31" }
          - { minor: "8.4", full: "8.4.23" }
          - { minor: "8.5", full: "8.5.7" }
    steps:
      - uses: actions/checkout@v4

      - name: Compute release version
        # See build-linux for rationale; strips leading "v" from the git ref.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          echo "EPHPM_RELEASE_VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build ephpm
        env:
          # LTO off on arm64: the fat-LTO final link of the ephpm binary
          # (libphp.a + ICU + everything, codegen-units=1 from profile.release
          # per #171) exceeds the arm64 build host's memory -- rustc gets
          # SIGKILLed by the OOM killer even running as the only job. Thin LTO
          # (#181) held for a while, but the turso engine (#183, linked by
          # default) grew the binary past what thin-LTO fits on this host in
          # the v0.5.1 arc. Disabling LTO cuts link-time memory the most, for
          # a low single-digit perf delta on a target with no published
          # benchmark numbers. Revisit thin/fat once the VM memory is raised.
          CARGO_PROFILE_RELEASE_LTO: "off"
        run: cargo xtask release ${{ matrix.php.minor }}

      - name: Package archive
        id: pkg
        env:
          VERSION: ${{ github.ref_name }}
          PHP_FULL: ${{ matrix.php.full }}
        run: |
          set -eu
          name="ephpm-${VERSION}+php${PHP_FULL}-linux-aarch64"
          mkdir -p "dist/${name}"
          # cargo xtask release targets the gnu triple explicitly on Linux
          # (glibc-dynamic binary, dlopen-capable), so the binary lives under
          # target/<triple>/release/, not target/release/.
          cp "target/aarch64-unknown-linux-gnu/release/ephpm" "dist/${name}/ephpm"
          cp LICENSE "dist/${name}/LICENSE"
          cp .github/release-readme.txt "dist/${name}/README.txt"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
          echo "archive=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ephpm-${{ github.ref_name }}-php${{ matrix.php.full }}-linux-aarch64
          path: ${{ steps.pkg.outputs.archive }}

  # -- macOS binaries ---------------------------------------------------------
  build-macos:
    name: Build (PHP ${{ matrix.php_full }}, macos-aarch64)
    if: github.event_name == 'push'
    runs-on: [self-hosted, macos, arm64]
    strategy:
      fail-fast: false
      # One fat-LTO release build at a time on the Apple Silicon host — it
      # also hosts the linux-arm64 build VM (see build-linux-arm64). Raise
      # to 2 only after a release proves real headroom.
      max-parallel: 1
      matrix:
        include:
          - php_minor: "8.3"
            php_full: "8.3.31"
          - php_minor: "8.4"
            php_full: "8.4.23"
          - php_minor: "8.5"
            php_full: "8.5.7"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compute release version
        # See build-linux for rationale; strips leading "v" from the git ref.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          echo "EPHPM_RELEASE_VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Pin libclang for bindgen
        # Pin libclang to brew llvm@17 to dodge the bindgen
        # CXCallingConv-20 panic; also pin the clang resource-dir so
        # bindgen uses llvm@17's NEON headers instead of Apple-clang
        # 21's (which use the newer __mfp8 type). Mirrors nightly.yml.
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          brew install llvm@17 || brew upgrade llvm@17 || true
          LLVM_PREFIX=$(brew --prefix llvm@17)
          LLVM_RESOURCE_DIR=$(ls -d "${LLVM_PREFIX}"/lib/clang/* | head -1)
          echo "LIBCLANG_PATH=${LLVM_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-resource-dir=${LLVM_RESOURCE_DIR}" >> "$GITHUB_ENV"

      - name: Build ephpm
        env:
          # PHP SDK 8.5.7 macOS objects are built with a newer Xcode that
          # emits calls to `___isPlatformVersionAtLeast` (macOS 12+ runtime
          # helper). The linker infers deployment target from the .rlib
          # objects and complains at 11.0. Setting the floor to 12.0 (Apple
          # dropped support for anything older) resolves it and matches the
          # SDK's build environment. 8.3/8.4 SDKs also link cleanly at 12.0.
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: cargo xtask release ${{ matrix.php_minor }}

      - name: Package archive
        id: pkg
        env:
          VERSION: ${{ github.ref_name }}
          PHP_FULL: ${{ matrix.php_full }}
        run: |
          set -eu
          name="ephpm-${VERSION}+php${PHP_FULL}-macos-aarch64"
          mkdir -p "dist/${name}"
          # xtask release targets aarch64-apple-darwin, not target/release/.
          cp target/aarch64-apple-darwin/release/ephpm "dist/${name}/ephpm"
          cp LICENSE "dist/${name}/LICENSE"
          cp .github/release-readme.txt "dist/${name}/README.txt"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
          echo "archive=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ephpm-${{ github.ref_name }}-php${{ matrix.php_full }}-macos-aarch64
          path: ${{ steps.pkg.outputs.archive }}

  # -- Windows binaries (native on self-hosted Windows runner) --------------
  build-windows:
    name: Build (PHP ${{ matrix.php_full }}, windows-x86_64)
    if: github.event_name == 'push'
    runs-on: [self-hosted, windows, x64]
    strategy:
      fail-fast: false
      # One release build per Windows worker at a time: the v0.5.1 run's 3
      # concurrent legs took the pool down mid-build (work-dir device
      # vanished under the runner). Loosen only with proven headroom.
      max-parallel: 1
      matrix:
        include:
          - php_minor: "8.3"
            php_full: "8.3.31"
          - php_minor: "8.4"
            php_full: "8.4.23"
          - php_minor: "8.5"
            php_full: "8.5.7"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: powershell
        run: |
          $cargoBin = "$env:USERPROFILE\.cargo\bin"
          if (-not (Test-Path "$cargoBin\rustup.exe")) {
            Write-Host "Installing rustup..."
            Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain stable --profile minimal
            Remove-Item rustup-init.exe
          }
          $env:PATH = "$cargoBin;$env:PATH"
          $cargoBin | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          & "$cargoBin\rustup.exe" show

      - name: Install Visual Studio Build Tools
        shell: powershell
        # Mirrors php-sdk's install block; runner image is bare so each
        # job installs VS Build Tools fresh via the official bootstrapper.
        run: |
          $installPath = "C:\BuildTools"
          $msbuild = "$installPath\MSBuild\Current\Bin\MSBuild.exe"
          if (Test-Path $msbuild) {
            Write-Host "VS Build Tools already present at $installPath"
          } else {
            Write-Host "Downloading VS Build Tools bootstrapper..."
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile vs_buildtools.exe
            $proc = Start-Process -FilePath .\vs_buildtools.exe `
              -ArgumentList @(
                '--quiet', '--wait', '--norestart', '--nocache',
                '--installPath', $installPath,
                '--add', 'Microsoft.VisualStudio.Workload.VCTools',
                '--add', 'Microsoft.VisualStudio.Component.VC.Llvm.Clang',
                '--includeRecommended'
              ) -Wait -PassThru -NoNewWindow
            Write-Host "Bootstrapper exit code: $($proc.ExitCode)"
            Remove-Item vs_buildtools.exe
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            while (-not (Test-Path $msbuild) -and $sw.Elapsed.TotalMinutes -lt 20) {
              Start-Sleep -Seconds 30
              Write-Host ("  ...waiting for VS install ({0:F0}s)" -f $sw.Elapsed.TotalSeconds)
            }
            if (-not (Test-Path $msbuild)) {
              Write-Host "::error::VS install timed out - $msbuild never appeared"
              exit 1
            }
            Write-Host ("MSBuild.exe found after {0:F0}s" -f $sw.Elapsed.TotalSeconds)
          }

      - name: Enter MSVC developer environment
        shell: powershell
        run: |
          $vcvars = "C:\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { Write-Error "vcvars64.bat not found"; exit 1 }
          $envBefore = @{}
          foreach ($e in [Environment]::GetEnvironmentVariables().GetEnumerator()) {
            $envBefore[$e.Key] = $e.Value
          }
          $cmdLine = 'call "' + $vcvars + '" >NUL & set'
          $output = & cmd /c $cmdLine
          foreach ($line in $output) {
            if ($line -match '^([^=]+)=(.*)$') {
              if ($envBefore[$matches[1]] -ne $matches[2]) {
                "$($matches[1])=$($matches[2])" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
              }
            }
          }
          $libclangDir = "C:\BuildTools\VC\Tools\Llvm\x64\bin"
          if (Test-Path "$libclangDir\libclang.dll") {
            "LIBCLANG_PATH=$libclangDir" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          } else {
            Write-Warning "libclang.dll not found at $libclangDir -- bindgen may panic"
          }

      - name: Compute release version
        # See build-linux for rationale; strips leading "v" from the git ref.
        shell: powershell
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME -replace '^v',''
          "EPHPM_RELEASE_VERSION=$version" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Build ephpm.exe
        shell: powershell
        env:
          # LTO off on Windows: the fat-LTO final link (libphp static lib +
          # everything, codegen-units=1 from profile.release per #171) OOMs
          # rustc-LLVM on the ephemerd worker VMs ("rustc-LLVM ERROR: out of
          # memory"). Windows built fine on fat-LTO through v0.5.0; the turso
          # engine (#183, linked by default) grew the binary enough to OOM in
          # the v0.5.1 arc, and thin-LTO (#193) was not enough either.
          # Disabling LTO cuts link-time memory the most, for a low
          # single-digit perf delta on a target with no published benchmark
          # numbers. Same trade as linux-aarch64. Revisit once VM memory grows.
          CARGO_PROFILE_RELEASE_LTO: "off"
          # Bump rustc's thread stack: with LTO off the Windows build gets
          # far enough to compile sqlparser (a turso #183 dependency), whose
          # deeply-recursive AST types overflow rustc's default thread stack
          # on the Windows toolchain (STATUS_STACK_OVERFLOW, 0xc00000fd),
          # made heavier by codegen-units=1 + opt-level=3. 32 MiB clears it.
          # linux-aarch64 compiles sqlparser fine, so this is windows-only.
          RUST_MIN_STACK: "33554432"
        run: cargo xtask release ${{ matrix.php_minor }} --target windows --no-sqld

      - name: Package archive
        id: pkg
        shell: powershell
        env:
          VERSION: ${{ github.ref_name }}
          PHP_FULL: ${{ matrix.php_full }}
        run: |
          $name = "ephpm-$env:VERSION+php$env:PHP_FULL-windows-x86_64"
          $stage = "dist\$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\ephpm.exe "$stage\ephpm.exe"
          Copy-Item LICENSE "$stage\LICENSE"
          Copy-Item .github\release-readme.txt "$stage\README.txt"
          # tar.gz on Windows: built-in `tar` (bsdtar) on Win10/11 1809+
          # produces a portable archive consumers can `tar xzf` cross-OS.
          tar -C dist -czf "dist\$name.tar.gz" $name
          Remove-Item -Recurse -Force $stage
          "archive=dist/$name.tar.gz" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ephpm-${{ github.ref_name }}-php${{ matrix.php_full }}-windows-x86_64
          path: ${{ steps.pkg.outputs.archive }}

  # -- Docker images on Docker Hub --------------------------------------------
  docker-image:
    name: Docker (PHP ${{ matrix.php_full }})
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - php_minor: "8.3"
            php_full: "8.3.31"
          - php_minor: "8.4"
            php_full: "8.4.23"
            default: false
          - php_minor: "8.5"
            php_full: "8.5.7"
            default: true
    steps:
      # On a tag push this is the tag; on a workflow_dispatch republish it is
      # the tag named in the input (the run itself is dispatched from main, so
      # the default ref would be main's source).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # No docker/setup-buildx-action here, by design.
      #
      # setup-buildx-action defaults to the `docker-container` driver, which
      # boots moby/buildkit as a PRIVILEGED container. The ephemerd runner
      # fleet disables privileged containers (dind.allow_privileged, default
      # off), so as of the v0.6.1 run every Docker leg died at builder boot:
      #
      #   ERROR: Error response from daemon: privileged containers are
      #   disabled on this host (set dind.allow_privileged = true ...)
      #
      # Switching the action to `driver: docker` does not help either: that
      # driver reaches the daemon's embedded BuildKit over the /grpc hijack
      # endpoint, and ephemerd's Docker-API shim implements neither /grpc nor
      # /session -- both return "not yet implemented".
      #
      # The path ephemerd actually supports is the classic client-side build:
      # POST /build with a tar context, served by its in-process BuildKit
      # solver. That is what ci-image.yml has always used on this fleet.
      # Nothing here needs the container driver: the build is single-platform
      # (the runner is native linux/amd64), exports no cache (no
      # cache-to/cache-from), and requests no insecure entitlements. Multiple
      # -t tags, --build-arg and --label all translate to BuildKit frontend
      # attrs on the /build path, so no capability is given up.

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          PHP_MINOR: ${{ matrix.php_minor }}
          PHP_FULL: ${{ matrix.php_full }}
          IS_DEFAULT: ${{ matrix.default }}
        run: |
          set -eu
          # Strip leading "v" so EPHPM_RELEASE_VERSION matches clap formatting
          # ("v0.1.1" -> "0.1.1"). Forwarded to the Docker builder as a
          # build-arg so the in-container `cargo xtask release` reports the
          # tag via `ephpm --version`. See crates/ephpm/build.rs.
          echo "release_version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          # All tags substitute "+" -> "-" because OCI tag regex rejects "+".
          # The real SemVer string lives in the OCI label (see --label below).
          # Pre-release tags (e.g. v0.1.0-rc.1, detected by the "-") must not
          # move the rolling tags (:latest, :<minor>); those track stable
          # releases only.
          case "${VERSION}" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          tags="ephpm/ephpm:${VERSION}-php${PHP_FULL}"
          tags="${tags},ephpm/ephpm:${VERSION}-php${PHP_MINOR}"
          if [ "${prerelease}" = "false" ]; then
            tags="${tags},ephpm/ephpm:${PHP_MINOR}"
          fi
          if [ "${IS_DEFAULT}" = "true" ]; then
            tags="${tags},ephpm/ephpm:${VERSION}"
            if [ "${prerelease}" = "false" ]; then
              tags="${tags},ephpm/ephpm:latest"
            fi
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "semver=${VERSION}+php${PHP_FULL}" >> "$GITHUB_OUTPUT"

      # Plain `docker build` + `docker push` rather than
      # docker/build-push-action, which always goes through buildx. See the
      # note above the login step for why buildx cannot work on this fleet.
      #
      # Side benefit: the classic path produces no ".dockerbuild" build-record
      # artifact at all, so the DOCKER_BUILD_RECORD_UPLOAD/DOCKER_BUILD_SUMMARY
      # opt-outs this step used to carry are moot -- the Create Release job's
      # artifact download stays at the 12 binary archives it expects.
      - name: Build and push image
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          PHP_FULL: ${{ matrix.php_full }}
          RELEASE_VERSION: ${{ steps.tags.outputs.release_version }}
          SEMVER: ${{ steps.tags.outputs.semver }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          # A tag push always publishes; a dispatch publishes only when asked,
          # so the same job doubles as a build-only smoke test.
          PUSH: ${{ github.event_name == 'push' || inputs.publish }}
          # Force the legacy client-side build path. Docker CLI v23+ routes
          # `docker build` through buildx whenever the daemon advertises
          # BuilderVersion "2" -- which ephemerd deliberately does -- and that
          # lands on the unimplemented /grpc endpoint. DOCKER_BUILDKIT=0 keeps
          # the CLI on POST /build, which ephemerd's embedded BuildKit solver
          # serves. Same setting, same reason, as ci-image.yml.
          DOCKER_BUILDKIT: "0"
        run: |
          set -euo pipefail

          # Read the revision from the checkout, not github.sha: on a
          # republish dispatch github.sha is main's commit, while the tree we
          # actually built is the tag's.
          REVISION="$(git rev-parse HEAD)"

          IFS=',' read -ra tag_list <<< "$TAGS"
          tag_args=()
          for t in "${tag_list[@]}"; do
            tag_args+=(-t "$t")
          done

          echo "==> building ${#tag_list[@]} tag(s):"
          printf '      %s\n' "${tag_list[@]}"

          # --no-cache: release images must never depend on the shared
          # builder cache — a poisoned parent-snapshot entry on the fleet
          # (surviving prune AND the ephemerd #146 GC) failed the v0.6.3
          # Docker legs four times. Cache buys little on release builds;
          # correctness buys everything.
          docker build \
            --no-cache \
            -f docker/Dockerfile \
            --build-arg "PHP_SDK_VERSION=${PHP_FULL}" \
            --build-arg "EPHPM_RELEASE_VERSION=${RELEASE_VERSION}" \
            --label "org.opencontainers.image.title=ephpm" \
            --label "org.opencontainers.image.description=All-in-one PHP application server in a single binary" \
            --label "org.opencontainers.image.source=${SOURCE_URL}" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            --label "org.opencontainers.image.version=${SEMVER}" \
            --label "org.opencontainers.image.licenses=MIT" \
            "${tag_args[@]}" \
            .

          if [ "${PUSH}" != "true" ]; then
            echo "==> publish not requested; built only, nothing pushed."
            exit 0
          fi

          # One push per tag: ephemerd's push endpoint resolves a single ref at
          # a time (each -t was registered in its image store by the build).
          for t in "${tag_list[@]}"; do
            echo "==> pushing ${t}"
            docker push "$t"
          done

  # -- Release: gather archives, hash them, attach to the GitHub release ------
  release:
    name: Create Release
    needs: [build-linux, build-linux-arm64, build-macos, build-windows, docker-image]
    # `!cancelled()` overrides the default "skip when a dependency was skipped"
    # so the republish path (where the four binary legs are intentionally
    # skipped) can still run. The explicit result checks keep the tag-push
    # semantics unchanged: every leg must have succeeded.
    if: >-
      ${{ !cancelled()
          && needs.docker-image.result == 'success'
          && (github.event_name == 'push'
              && needs.build-linux.result == 'success'
              && needs.build-linux-arm64.result == 'success'
              && needs.build-macos.result == 'success'
              && needs.build-windows.result == 'success'
              || github.event_name == 'workflow_dispatch'
                 && inputs.publish
                 && inputs.artifacts_run_id != '') }}
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
      # Needed to list this run's artifacts via the REST API (below).
      actions: read
    steps:
      - uses: actions/checkout@v4

      # Collect the build archives via the REST run-artifacts endpoint rather
      # than actions/download-artifact@v4. download-artifact only sees the
      # CURRENT run attempt's artifacts, so a `gh run rerun --failed` (which
      # only re-uploads the reran legs) leaves the already-green legs' archives
      # stranded on the prior attempt and the publish fails -- which forced
      # every retry to be a full all-legs rebuild. The run-artifacts endpoint
      # lists every artifact across ALL attempts, so a single flaky leg can be
      # rerun-failed without redoing the whole matrix. The script downloads
      # sequentially, which also avoids the parallel egress saturation that
      # made the old all-at-once download silently drop its tail.
      - name: Collect build archives (all run attempts)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Normally this run's own artifacts. On a republish dispatch the
          # binaries live on the original tag run, named by artifacts_run_id.
          RUN_ID: ${{ github.event.inputs.artifacts_run_id || github.run_id }}
          OUT_DIR: artifacts
        run: bash .github/scripts/collect_release_artifacts.sh

      - name: Collect archives and write SHA256SUMS
        id: collect
        run: |
          set -eu
          mkdir -p release
          # The collect step above extracted every archive flat under
          # artifacts/; gather them so SHA256SUMS lives next to what it sums.
          find artifacts -type f -name '*.tar.gz' -exec cp {} release/ \;
          (cd release && sha256sum *.tar.gz | sort > SHA256SUMS)
          echo "Collected $(ls release/*.tar.gz | wc -l) archives:"
          ls -lh release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          # Explicit rather than inferred from github.ref: a republish dispatch
          # runs from main, where the inferred tag would be "main".
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          # SemVer pre-release tags carry a "-" (e.g. v0.1.0-rc.1, v0.2.0-beta.2).
          # Mark them prerelease so GitHub does not promote them to "Latest"
          # and demote the actual stable release in the Releases UI.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
