[workspace]
# `examples/rust-middleware` is the worked example for the native-middleware
# C ABI. It is a workspace member so `cargo clippy --workspace` and
# `cargo +nightly fmt --all` keep it compiling against the current ABI — an
# example that has drifted out of tree is worse than no example. It is kept
# OUT of `default-members` so a plain `cargo build` does not pay for it.
members = ["crates/*", "examples/rust-middleware", "xtask"]
default-members = ["crates/*"]
exclude = ["crates/ephpm-e2e"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88 is forced by the litewire dependency (its 0.2.0 workspace declares
# rust-version = "1.88"); cargo refuses to compile a dep whose rust-version
# exceeds the active toolchain, so 1.85–1.87 cannot build this workspace.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ephpm/ephpm"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy", "http1"] }
http-body-util = "0.1"
http = "1"
tower = { version = "0.5", features = ["full"] }
serde = { version = "1", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
# Parser for the per-site config file a tenant commits to its own repository
# (`crates/ephpm-server/src/site_config.rs`). Already in the graph via figment,
# so this pins the same crate rather than adding one — deliberate: that file is
# untrusted input, and TOML has no anchor/alias expansion to defend against.
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OTLP trace export — only compiled behind the `otlp` cargo feature on
# ephpm-server (forwarded by the ephpm binary's `otlp` feature). The
# opentelemetry / tracing-opentelemetry pair must be bumped in lockstep:
# tracing-opentelemetry 0.32.x targets the opentelemetry 0.31.x line.
#
# BOTH OTLP transports are compiled in, and the one used is chosen at runtime
# by `OTEL_EXPORTER_OTLP_PROTOCOL` (`grpc` | `http/protobuf`), per the OTel
# spec. See `ephpm-server/src/otlp.rs` for why runtime selection rather than a
# cargo feature: ePHPm ships one release binary, so a compile-time choice would
# have to pick a transport for every user.
#
# - `http-proto` + `reqwest-blocking-client`: the http/protobuf transport, on a
#   blocking client so it needs no tokio runtime.
# - `grpc-tonic`: the OTLP/gRPC transport. tonic is async, so `otlp.rs` owns a
#   small dedicated tokio runtime for it — the tracing subscriber is built in
#   `main` before the server's runtime exists (PHP must init single-threaded).
# - `internal-logs`: routes the SDK's own export failures into `tracing`.
#   It is in this crate's DEFAULT feature set, and turning defaults off without
#   restoring it is what made every export failure silent (#378).
#
# `tls-provider-agnostic` is the ONLY correct TLS feature here, for exactly the
# reason spelled out for reqwest below: `tls`, `tls-ring`, `tls-roots` and
# `tls-webpki-roots` all expand to `tonic/tls-ring` and link `ring`. The
# provider-agnostic variant enables no provider at all, and tonic then resolves
# one via `CryptoProvider::get_default()` — which `otlp.rs` installs from
# `tls::crypto_provider()`, so gRPC follows the same provider as everything
# else by construction.
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "grpc-tonic", "tls-provider-agnostic", "internal-logs"] }
tracing-opentelemetry = { version = "0.32", default-features = false }
# Depended on directly only for the gRPC exporter's root store: the two
# `tls-*-roots` features are what make `ClientTlsConfig::with_enabled_roots()`
# exist. Neither pulls a crypto provider (`tls-native-roots` and
# `tls-webpki-roots` expand to `_tls-any` + `channel` + the roots crate), which
# is what makes them safe here where `tonic/tls` is not.
tonic = { version = "0.14", default-features = false, features = ["tls-native-roots", "tls-webpki-roots"] }
# The OTLP exporter's HTTP client, so an `https://` collector endpoint works
# (without these features reqwest is built with no TLS backend at all and
# every https:// export fails at connect time).
#
# `rustls-tls-manual-roots-no-provider` is the ONLY correct feature here.
# Every other `rustls-tls-*` feature ALSO enables reqwest's `__rustls-ring`,
# which links `ring` and reintroduces the multi-provider bug tracked in #241
# (see `ephpm-server/src/tls.rs::crypto_provider`). "manual roots" +
# "no provider" means reqwest supplies neither a crypto provider nor a root
# store; `otlp.rs` hands it a fully-built `rustls::ClientConfig` instead.
# That is also why the roots are our own dependencies below.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-manual-roots-no-provider"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
mime_guess = "2"
flate2 = "1"
brotli = "7"
zstd = "0.13"
ipnet = "2"
# CIDR membership for the `ip-allowlist` builtin middleware (IPv4 + IPv6).
# Default features only (`serde` is opt-in and not enabled), so no extra
# transitive deps beyond std IP parsing.
ipnetwork = "0.21"
# Constant-time key comparison for the `api-key` builtin middleware. Tiny,
# no_std, no transitive deps.
subtle = "2"
tracing-appender = "0.2"
# ONE rustls crypto provider for the whole tree: aws-lc-rs (issue #241).
#
# rustls only auto-selects a provider when EXACTLY ONE of its `ring` /
# `aws_lc_rs` features is enabled; with both on, `from_crate_features()`
# returns `None` and every bare `ServerConfig::builder()` /
# `ClientConfig::builder()` panics at runtime with "Could not automatically
# determine the process-level CryptoProvider". That is what broke static
# `[server.tls]` startup in every release from v0.1.0 to v0.6.1 (#243).
#
# aws-lc-rs rather than ring, because ring cannot be the sink:
#   - `ephpm-db` needs RSA-OAEP for the caching_sha2_password full-auth
#     handshake and ring has no public-key *encryption* at all (see the
#     aws-lc-rs pin below);
#   - `rustls-acme` + `rcgen` (ACME/TLS-ALPN-01) and `pgwire` (via litewire)
#     enable aws-lc-rs unconditionally.
# So aws-lc-rs is compiled in no matter what we choose, and picking ring
# would leave BOTH providers linked. Choosing aws-lc-rs costs no new build
# toolchain either: it is already built in every release lane (Linux gnu,
# macOS, Windows MSVC) as a direct dependency of ephpm-db.
#
# Cargo features are additive and cannot be turned off from here, so the
# only way to keep this true is to keep every rustls consumer off `ring`.
# The guard is `crates/ephpm-server/tests/tls_single_crypto_provider.rs`,
# which fails the moment anything re-introduces `rustls/ring`.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
# HTTP/3 (QUIC). `rustls-aws-lc-rs` keeps QUIC on the SAME rustls crypto
# provider the TCP TLS path uses (see the rustls pin above) - mixing
# providers is a runtime panic risk. It also keeps quinn-proto's own
# packet-protection crypto on aws-lc-rs instead of dragging `ring` back in.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls-acme = { version = "0.15", default-features = false, features = ["tokio", "aws-lc-rs", "tls12", "webpki-roots"] }
tokio-stream = "0.1"
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["pem", "aws_lc_rs"] }
serial_test = "3"
dashmap = "6"
parking_lot = "0.12"
tokio-util = { version = "0.7", features = ["rt", "compat"] }
bytes = "1"
sha1 = "0.10"
sha2 = "0.10"
# OS entropy for the per-process per-site database master secret
# (ephpm-server/src/site_wire_auth.rs). A syscall shim, not a generator — this
# secret is drawn once at startup, so there is nothing to seed or reseed.
getrandom = "0.3"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
md5 = "0.8"
# RSA-OAEP public-key encryption for the caching_sha2_password full-auth
# handshake (crates/ephpm-db/src/mysql.rs). Already in the dependency graph via
# rustls-acme and rcgen, so this pulls in nothing new — and it lets us avoid the
# pure-Rust `rsa` crate, which still carries the unpatched RUSTSEC-2023-0071
# (Marvin timing sidechannel).
#
# This is also why `ring` cannot be the workspace's single crypto provider:
# ring exposes RSA *signing* and verification but no public-key encryption,
# so there is no ring equivalent of `aws_lc_rs::rsa::OaepPublicEncryptingKey`.
# See the rustls pin above (issue #241).
aws-lc-rs = "1.16"
base64ct = { version = "1", features = ["alloc"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp"] }
chitchat = "0.10"
serde_json = "1"
async-trait = "0.1"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
async-channel = "2"
libloading = "0.8"
yamux = "0.14"
# WebSocket framing for the native `[server.websocket]` path. `tungstenite`'s
# default features pull in a TLS stack we already have (rustls) and a URL
# parser only a *client* needs; ePHPm is server-side only, and hyper has
# already done the HTTP handshake by the time we hand the socket over, so the
# codec is all we want.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }

# Internal crates
ephpm-cluster = { path = "crates/ephpm-cluster" }
ephpm-config = { path = "crates/ephpm-config" }
ephpm-db = { path = "crates/ephpm-db" }
ephpm-kv = { path = "crates/ephpm-kv" }
ephpm-middleware = { path = "crates/ephpm-middleware" }
ephpm-middleware-builtins = { path = "crates/ephpm-middleware-builtins" }
ephpm-php = { path = "crates/ephpm-php" }
ephpm-query-stats = { path = "crates/ephpm-query-stats" }
ephpm-server = { path = "crates/ephpm-server" }
ephpm-ws = { path = "crates/ephpm-ws" }

# External — litewire (embedded SQLite wire protocol proxy)
#
# Pinned to a specific commit so builds are reproducible. To bump, replace `rev`
# with the new commit hash and run `cargo update -p litewire`.
#
# For local development against a sibling litewire checkout, add to your local
# (gitignored) .cargo/config.toml:
#
#   [patch."https://github.com/ephpm/litewire.git"]
#   litewire = { path = "../litewire/crates/litewire" }
# litewire @ 344d2c23bf4e — PERF: the MySQL command filter now hands
# opensrv-mysql a whole command packet per `poll_read` (litewire#37, ePHPm #322).
#
# The filter added in litewire#28 (pin cb707ab9) returned the four-byte packet
# header plus the command byte on their own and made opensrv-mysql poll again
# for the body. `PacketReader::next_async` loops until a packet parses and
# escalates its scratch buffer from 4 KiB to 1 MiB on the SECOND iteration, so
# splitting the header off guaranteed a `Vec::resize(1_048_576, 0)` — a 1 MiB
# zeroing memset — for every command packet. That is the whole of the v0.7.0
# wire regression measured in #322: 12.8% of cycles in
# `__memset_avx2_unaligned_erms`, and −15.7% on a fresh-connection +
# ten-point-SELECT wire benchmark, recovered to −0.5% of the v0.6.3 shape by
# this pin. The in-process `ephpm_db_*` bridge never touches the MySQL frontend,
# which is why the bridge half of the lab suite stayed flat throughout.
#
# Do not move this pin backwards past litewire#37 without re-measuring the wire
# path: every pin from cb707ab9 to 10345a869d27 carries the 1 MiB memset.
#
# Previous pin 10345a869d27 — turso 0.7.0 → 0.7.2 (litewire#36). Code-identical
# to defab22f0c2d; the only change is the engine pin. Measured neutral for the
# wire path (±1% on the same benchmark), so it is NOT the #322 regression.
#
# Previous pin defab22f0c2d — 0.2.0 (litewire#33–#35). Three batches:
# (1) litewire#34 SECURITY: lru 0.12.5 → 0.18.2, fixing RUSTSEC-2026-0253 — a
# use-after-free reachable through the production TranslateCache. Do not move
# this pin backwards past litewire#34. Same PR adds a server-side
# tenant-session SQL screen (litewire-backend/tenant_screen.rs): sessions
# established through a `ConnectionAuthenticator` reject ATTACH/DETACH/
# VACUUM-with-target/path-PRAGMA inside litewire itself, layered UNDER ePHPm's
# own screen (ours stays — defence in depth, and it also covers the
# non-authenticated single-site path). Also pins the opensrv-mysql `tls`
# feature fence upstream (litewire#32 closed): the CLIENT_SSL auth-bypass
# analysis in the b16d874b entry below is now enforced by litewire's own
# Cargo.toml rather than by our reliance on default features.
# (2) litewire#33: docs truth pass + 0.2.0 scaffolding — workspace version
# 0.2.0, MSRV 1.88 (which is why ePHPm's rust-version moved 1.85 → 1.88 in the
# same PR as this bump: cargo refuses to compile a dependency whose declared
# rust-version exceeds the toolchain, so a 1.85 toolchain can no longer build
# the workspace regardless of what ePHPm declares).
# (3) litewire#35 perf: TranslateCache borrowed-key lookup + Arc'd entries
# (~2.9x on the translate hit path — no API change), and an opt-in Turso
# handle-reuse pool (`.handle_reuse(N)`), OFF by default. ePHPm does not call
# `.handle_reuse`, so no behavior change from that half.
#
# Previous pin cb707ab9 — WordPress wire-fidelity fixes (litewire#28–#31).
# Four things, all surfaced by running real WordPress over the MySQL frontend:
# (1) litewire#28: unparseable/unsupported client commands no longer get a
# default OK packet from opensrv-mysql's fallthrough — an OK of the wrong
# shape desynced persistent connections (the client attributed the stray
# packet to its NEXT command and every later response was off by one).
# (2) litewire#29: REGEXP / NOT REGEXP and YEAR()/MONTH()/DAYOFMONTH() are
# translated to SQLite equivalents — WordPress core uses these in date
# archives and wp_posts date queries.
# (3) litewire#30: one server version string for the handshake, VERSION() and
# @@version — they previously disagreed, and WordPress Site Health / wpdb
# read VERSION() to decide utf8mb4 support.
# (4) litewire#31: MySQL errno fidelity — no-such-table maps to 1146 (was a
# generic error) and duplicate-key 1062 carries a MySQL-shaped message, so
# wpdb/plugin code that matches on errno or message text behaves.
# Strictly additive on the wire path: no dependency or feature changes, and
# opensrv-mysql keeps its default features, so the CLIENT_SSL analysis in the
# b16d874b entry below still holds (litewire#32 tracks pinning that property
# upstream; still open at this bump).
#
# Previous pin b16d874b — per-connection backend selection (litewire#27).
# Adds `LiteWire::with_authenticator` + the `ConnectionAuthenticator` trait,
# which is what lets ONE MySQL listener front many per-site databases: the
# backend is resolved during the handshake from the *authenticated* username,
# so a tenant that cannot produce another tenant's password cannot reach its
# database. ePHPm consumes this in `site_wire_auth.rs` to restore multi-tenant
# `pdo_mysql` (#286) after #284 had to disable the wire listeners.
#
# Three parts matter to us:
# (1) `ConnectionAuthenticator::authenticate` is async and returns
# `Option<SharedBackend>` — `None` refuses the connection. It runs BEFORE any
# backend session exists, so a connection that never authenticates has nothing
# to reach. That "no auth ⇒ no backend" property is structural in the handler
# (an empty `OnceLock` that only `authenticate()` fills, plus a refusal on
# every command path), not a check — opensrv-mysql calls `authenticate()`
# conditionally on `handshake.username.is_some()`, and its parser yields `None`
# on the pre-TLS CLIENT_SSL branch. That branch is unreachable while
# opensrv-mysql keeps its default `tls` feature, but `default-features = false`
# would drop the re-parse that saves it and turn it into an auth bypass.
# (2) `litewire_mysql::native_password` — server-side mysql_native_password
# verification (constant-time). Protocol, not policy: which tenant owns which
# password stays with us.
# (3) A random per-connection scramble on the authenticating path.
# opensrv-mysql's default salt is a compile-time CONSTANT shared by every
# connection ever made, which makes an `auth_response` a static function of the
# password and replayable forever.
#
# Strictly additive: `LiteWire::new(backend)`, `MysqlFrontend::new`, and the
# single-site path are behaviour-identical — single-site keeps the historical
# accept-everyone handshake and the upstream constant salt.
#
# SECURITY: do not move this pin backwards past b16d874b while multi-site
# `pdo_mysql` is enabled. Earlier revisions have no `with_authenticator` at
# all, so the multi-tenant listener cannot be built — but a revision that had
# a partial form would serve one shared database to every tenant, which is the
# hole #284/#286 exist to close.
#
# Previous pin e34c6392 — WordPress-correctness fixes (litewire#25, #26).
# Three things, all found by benchmarking real WordPress on ephpm:
# (1) MySQL LIKE patterns now get the implicit ESCAPE '\' clause SQLite
# lacks, so wpdb::esc_like()-escaped %/_ match literally (litewire#20).
# (2) SQL_CALC_FOUND_ROWS / FOUND_ROWS() are emulated via session state —
# WordPress found_posts / X-WP-Total were 0 site-wide before (litewire#23).
# (3) A plain `LIMIT n` was silently DELETED from every translated MySQL
# query (only the `LIMIT offset, count` comma form survived a take());
# LIMITed queries returned every row. Fixed + regression-pinned.
#
# Previous pin 541290c4 — Session extraction (litewire#18). The dialect
# translation + transaction-state + error-mapping core of the MySQL handler now
# lives in the public `litewire-session` crate (`Session`), which the ephpm_db_*
# in-process bridge consumes. Also fixes a silent multi-statement drop: the old
# handler executed only the FIRST translated statement, so `ALTER TABLE ... ADD
# KEY` expansions (Laravel schema builder) never created their secondary
# indexes; Session executes all translated statements in order.
#
# Previous pin b086ddaa — CDC replay hardening (litewire#17). Two things.
# (1) Replayed schema DDL is parsed and allowlisted before it reaches the
# engine. A CDC batch carrying a `sqlite_schema` row used to have its stored
# `sql` text executed as-is, so a peer whose frames reached `apply_batch` could
# run arbitrary SQL on a replica — confirmed by short-circuiting the new
# allowlist, where `PRAGMA writable_schema=ON` applied successfully.
# `classify_replayed_ddl` now admits only a *single* CREATE TABLE /
# CREATE [UNIQUE] INDEX / CREATE VIEW / CREATE TRIGGER, which is the whole set
# `sqlite_schema.sql` can hold (ALTER surfaces as the rewritten CREATE TABLE;
# DROP arrives as a DELETE that litewire answers with its own DROP ... IF
# EXISTS). CREATE VIRTUAL TABLE is refused deliberately — it invokes a module
# with peer-chosen arguments. CREATE TRIGGER is recognised and *skipped*, not
# replayed: CDC already carries the rows a trigger produced on the primary, so
# a replica holding the trigger would double-apply them. That matches what
# ephpm's snapshot bootstrap already does with triggers.
# (2) `TxnBatch::commit_change_id()` returns `Option<i64>` instead of panicking
# on an empty batch, and `apply_batch` reports an empty batch as an error.
#
# NOTE (v0.7.0): the write-admission / Hrana-client changelog entry below is
# historical. ePHPm no longer enables `backend-hrana-client`, so
# `HranaClient::write_permits` and the sqld single-writer collapse it mitigated
# are no longer reachable from the ePHPm binary — the clustered path is Turso
# CDC, and Turso is MVCC. The entry is retained only to document the pin's
# lineage.
#
# On top of write admission control for the Hrana/sqld backend
# (litewire#16): an opt-in write-permit semaphore (`HranaClient::write_permits`,
# 0 = unlimited = default) that queues excess writers instead of letting sqld
# collapse, wired to [db.sqlite.sqld] write_permits in the clustered path only.
# Reads never take a permit; an explicit transaction holds its permit from its
# first write until COMMIT. Fixes the clustered-SQLite write collapse (#217),
# where c>=8 concurrent writers completed *zero* requests — a hang, not a 500,
# so it was invisible to error-rate monitoring. Same PR closes a CI blind spot:
# `backend-hrana-client` is not a default feature, so litewire CI had never
# compiled hrana_client.rs at all and its unit tests had stopped compiling.
#
# On top of SQLite backend performance (litewire#15): a
# per-session worker thread replaces per-statement spawn_blocking, an opt-in
# handle-reuse pool (`RusqliteBuilder::handle_reuse`, enabled by ephpm's
# single-node path — see spawn_single_node_litewire), and a `max_connections`
# accept-time cap on the wire frontends (wired to [db.sqlite.proxy]
# max_connections). On top of CDC cold-start tolerance (litewire#14) and unbound
# params executed as NULL (litewire#13), identifier sanitization in
# the metadata translator (litewire#12), framework wire-compat (litewire#11) and
# the Phase 2 CDC tail/apply API (litewire#10).
#
# 23b8de63 (litewire#14) makes CdcTailer::poll_batch report an absent turso_cdc
# log as Ok(None) instead of an error. Turso creates that table lazily on the
# first captured write, so a freshly provisioned cluster has none; before the
# fix ephpm's CDC primary treated the poll error as fatal and dropped the
# replica's subscription every ~2s until someone wrote. ephpm no longer carries
# a local workaround for this — `cold_primary_holds_subscriber_open_until_first_write`
# in turso_cdc.rs fails if a pin without the fix is ever selected.
#
# The empty-batch half of litewire#17 does NOT remove a workaround. ephpm's
# frame-level rejection in `consume_frames` stays, downgraded from a
# workaround to defence in depth: validating a peer's frame is ephpm's job
# rather than the pinned revision's, and rejecting at decode time keeps the
# diagnostics legible, since every failure past that point is reported "at
# change_id N" — which an empty batch has no value for.
#
# SECURITY: do not move this pin backwards. Pins before litewire#17 execute
# peer-supplied `sqlite_schema.sql` text verbatim on the CDC apply path, which
# hands any node that clears the cluster handshake ATTACH and PRAGMA on every
# replica. 699e6345 and earlier interpolate the
# client-supplied table name straight into SQL text in
# litewire-translate/src/metadata.rs, and detect_metadata_query() runs before
# sqlparser, so a crafted identifier in SHOW CREATE TABLE / SHOW INDEX /
# DESCRIBE becomes arbitrary SQL. 7a0b59c4 adds sanitize_identifier() and
# applies it at every extraction site.
# v0.7.0 is Turso-only: the `backend-rusqlite` (in-process SQLite C engine)
# and `backend-hrana-client` (the client that talked to the now-removed sqld
# sidecar) features are DELIBERATELY not enabled. litewire itself still ships
# both — this is purely ePHPm de-linking them from the binary. The embedded
# SQLite-family engine is `turso` only. `hrana` (the Hrana *server* wire
# frontend, independent of the removed Hrana *client*) is kept.
litewire = { git = "https://github.com/ephpm/litewire.git", rev = "ce52816ff842", default-features = false, features = ["mysql", "postgres", "tds", "hrana", "turso"] }
# Direct dependency on the same turso the pinned litewire uses, so the
# snapshot-bootstrap dump code (Phase 2.1) can name turso::{Row, Value}
# in its signatures. Pinned to the exact version litewire pins (=0.7.2)
# so the two resolve to a single crate instance and TursoConnection
# (re-exported by litewire) is the same turso::Connection.
turso = { version = "=0.7.2", default-features = false }

# Release-profile tuning for v0.4.2 perf release.
#
# `lto = "fat"` and `codegen-units = 1` widen the optimizer's view across
# every crate at link time. Empirically this shaves 5-15% off tight
# hot paths (proxy dispatch, KV RESP framing, query-stats record) at the
# cost of a longer release build.
#
# `panic = "abort"` is DELIBERATELY NOT set. The middleware runtime
# (`crates/ephpm-middleware`) uses `std::panic::catch_unwind` to fail
# CLOSED on a panicking middleware `invoke` (return 500) and to fail
# STARTUP on a panicking `init`. Under `panic = "abort"` those
# `catch_unwind` calls become no-ops and any middleware panic terminates
# the whole process — every request dies instead of one. Keep unwinding.
[profile.release]
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "warn"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(php_linked)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow noisy pedantic lints
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
items_after_statements = "allow"
manual_clamp = "allow"
manual_let_else = "allow"
needless_pass_by_value = "allow"
ref_option = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
unchecked_time_subtraction = "allow"
ignore_without_reason = "allow"
uninlined_format_args = "allow"
unnecessary_cast = "allow"
unused_async = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
