[package]
name = "ephpm-e2e"
version = "0.1.0"
edition = "2024"
publish = false

# This crate is excluded from the workspace — it has different deps and
# is only built inside the E2E test runner container.
#
# The empty [workspace] table pins this crate as its own workspace root so
# cargo never walks up and grabs an outer manifest (matters when the checkout
# lives nested under another repo, e.g. git worktrees).
[workspace]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
brotli = "7"
anyhow = "1"
tempfile = "3"
# A real WebSocket client for the `websockets` suite. `client_async` (not
# `connect_async`) is what the suite uses: it does the RFC 6455 handshake over
# a socket we opened ourselves, so the request can carry `Host: ws-a.test`
# while actually connecting to 127.0.0.1 — which is how one loopback server
# gets tested as two virtual hosts.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
