[package]
name = "ephpm-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP server for ePHPm"

[dependencies]
async-trait.workspace = true
ephpm-cluster.workspace = true
ephpm-config.workspace = true
ephpm-db.workspace = true
ephpm-kv.workspace = true
ephpm-middleware = { workspace = true, features = ["host"] }
# Builtin middleware registry: the four in-tree module implementations
# linked in as a plain rlib (no C ABI exports), so `library = "jwt"` works
# in every binary — including custom fully static builds, where dlopen
# does not exist.
ephpm-middleware-builtins.workspace = true
ephpm-php.workspace = true
ephpm-query-stats.workspace = true
ephpm-ws.workspace = true
# WebSocket framing for the upgraded socket. hyper has already done the HTTP
# handshake, so only the codec is used (`from_raw_socket`).
tokio-tungstenite.workspace = true
# `StreamExt`/`SinkExt` on the WebSocket stream. Already in the graph via
# yamux/litewire.
futures.workspace = true
litewire.workspace = true
turso.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http.workspace = true
mime_guess.workspace = true
tracing.workspace = true
brotli.workspace = true
flate2.workspace = true
ipnet.workspace = true
thiserror.workspace = true
anyhow.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
rustls-acme.workspace = true
tokio-stream.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
dashmap.workspace = true
libloading.workspace = true
serde_json.workspace = true
serde = { workspace = true }
base64ct = { workspace = true }
tokio-util.workspace = true
bytes.workspace = true
sha2.workspace = true
getrandom.workspace = true
async-channel.workspace = true
quinn.workspace = true
h3.workspace = true
h3-quinn.workspace = true
# OTLP trace export — all optional, activated together by the `otlp` feature.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# The exporter's HTTP client and its trust anchors. We build the
# `rustls::ClientConfig` ourselves (see src/otlp.rs) so the exporter uses the
# same crypto provider as the rest of the server; reqwest is therefore
# compiled with no provider and no root store of its own.
reqwest = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

# Privilege drop ([server] run_as_user/run_as_group): setgroups/setgid/setuid
# and getpwnam/getgrnam name resolution live behind libc on Unix. No-op on
# other targets (the privdrop module compiles to a warn-only stub there).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# OTLP trace export: `tracing` spans (http.request / worker.queue_wait /
# php.execute) shipped to an OpenTelemetry collector over OTLP http/protobuf.
# Runtime activation is still opt-in via OTEL_EXPORTER_OTLP_ENDPOINT /
# [server.diagnostics] otlp_endpoint — see src/otlp.rs.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:reqwest",
    "dep:rustls-native-certs",
    "dep:webpki-roots",
]

[dev-dependencies]
# Span-tree assertions for the router's request spans (tests use a collector
# Layer over the registry; no OTLP needed).
tracing-subscriber.workspace = true
tempfile.workspace = true
rcgen.workspace = true
# Builds the client side of a mysql_native_password handshake, so the per-site
# wire-auth tests drive the real challenge/response rather than asserting
# against the verifier's own arithmetic.
sha1.workspace = true
# Paused-clock (`start_paused`) support for the idle-timeout watchdog tests.
tokio = { workspace = true, features = ["test-util"] }
# Excludes the CDC-metrics tests from running alongside anything else that
# mutates the process-global subscriber registry (turso_cdc_metrics::REGISTRY).
# Already a workspace dependency (ephpm-php uses it), so this adds no new crate
# to the tree. Works on `#[tokio::test]`, which a bare Mutex guard held across
# an await does not.
serial_test.workspace = true
# Real MySQL client for the handle-reuse experiment: PHP's `pdo_mysql` opens a
# connection per request, and the only way to observe what that does to
# litewire's session-worker free-list is to drive the wire frontend with a
# client that connects and disconnects the same way. Same pin as ephpm-db's
# proxy integration tests.
mysql_async = { version = "0.34", default-features = false, features = ["minimal-rust"] }

# Loadable middleware fixtures for the dlopen lane (tests/middleware_dlopen.rs).
#
# These are `examples` rather than workspace crates on purpose: cargo emits an
# example's declared crate-types during an ordinary `cargo test -p
# ephpm-server`, whereas a library crate's `cdylib` output is produced only by
# an explicit `cargo build -p <crate>` — not by `cargo test --workspace`, and
# not by a dev-dependency edge (both verified). That gap is why the dlopen
# loader had no enforced coverage: the one test that touched it skipped
# whenever the artifact was absent, which in CI was always.
[[example]]
name = "mw_probe_v1"
crate-type = ["cdylib"]

[[example]]
name = "mw_probe_abi_v2"
crate-type = ["cdylib"]

[[example]]
name = "mw_probe_no_invoke"
crate-type = ["cdylib"]

[lints]
workspace = true
