[package]
name = "ephpm-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP server for ePHPm"

[dependencies]
async-trait.workspace = true
ephpm-cluster.workspace = true
ephpm-config.workspace = true
ephpm-db.workspace = true
ephpm-kv.workspace = true
ephpm-middleware = { workspace = true, features = ["host"] }
# Builtin middleware registry: the four in-tree module implementations
# linked in as a plain rlib (no C ABI exports), so `library = "jwt"` works
# in every binary — including custom fully static builds, where dlopen
# does not exist.
ephpm-middleware-builtins.workspace = true
ephpm-php.workspace = true
ephpm-query-stats.workspace = true
ephpm-sqld.workspace = true
litewire.workspace = true
turso.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http.workspace = true
mime_guess.workspace = true
tracing.workspace = true
brotli.workspace = true
flate2.workspace = true
ipnet.workspace = true
thiserror.workspace = true
anyhow.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
rustls-acme.workspace = true
tokio-stream.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
dashmap.workspace = true
libloading.workspace = true
serde_json.workspace = true
serde = { workspace = true }
base64ct = { workspace = true }
tokio-util.workspace = true
bytes.workspace = true
sha2.workspace = true
async-channel.workspace = true

[dev-dependencies]
tempfile.workspace = true
rcgen.workspace = true
# Paused-clock (`start_paused`) support for the idle-timeout watchdog tests.
tokio = { workspace = true, features = ["test-util"] }
# Real MySQL client for the handle-reuse experiment: PHP's `pdo_mysql` opens a
# connection per request, and the only way to observe what that does to
# litewire's session-worker free-list is to drive the wire frontend with a
# client that connects and disconnects the same way. Same pin as ephpm-db's
# proxy integration tests.
mysql_async = { version = "0.34", default-features = false, features = ["minimal-rust"] }

# Loadable middleware fixtures for the dlopen lane (tests/middleware_dlopen.rs).
#
# These are `examples` rather than workspace crates on purpose: cargo emits an
# example's declared crate-types during an ordinary `cargo test -p
# ephpm-server`, whereas a library crate's `cdylib` output is produced only by
# an explicit `cargo build -p <crate>` — not by `cargo test --workspace`, and
# not by a dev-dependency edge (both verified). That gap is why the dlopen
# loader had no enforced coverage: the one test that touched it skipped
# whenever the artifact was absent, which in CI was always.
[[example]]
name = "mw_probe_v1"
crate-type = ["cdylib"]

[[example]]
name = "mw_probe_abi_v2"
crate-type = ["cdylib"]

[[example]]
name = "mw_probe_no_invoke"
crate-type = ["cdylib"]

[lints]
workspace = true
