[package]
name = "ephpm-php"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PHP embedding via libphp FFI for ePHPm"
build = "build.rs"

[dependencies]
ephpm-kv.workspace = true
# db_bridge: per-thread litewire Session executing PHP `ephpm_db_*` calls
# against the same backend the wire frontends serve.
litewire.workspace = true
tracing.workspace = true
thiserror.workspace = true
http.workspace = true
# Worker mode: async-producer / sync-consumer dispatch queue (async_channel
# speaks both send().await and recv_blocking()) plus oneshot response return.
async-channel.workspace = true
tokio = { workspace = true, features = ["sync"] }
# Phase 3 streaming bodies: zero-copy chunk buffers across the hyper<->worker
# bounded channels.
bytes.workspace = true
# Worker idle gauge, recorded where it is actually observable (the dispatch
# recv in worker_bridge).
metrics.workspace = true

[build-dependencies]
bindgen = "0.72"
cc = "1"

[dev-dependencies]
serial_test.workspace = true
tempfile.workspace = true
# db_bridge recycle tests: mock Backend/BackendConn impls (litewire's
# backend traits are async_trait-based).
async-trait.workspace = true
# crash_guard tests: install a sigaltstack + SIGSEGV handler and drive a real
# stack overflow to prove the containment mechanism without libphp.
libc = "0.2"

[lints]
workspace = true
