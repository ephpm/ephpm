[package]
name = "ephpm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "All-in-one PHP application server"

[[bin]]
name = "ephpm"
path = "src/main.rs"

[features]
# OTLP trace export (forwards to ephpm-server's `otlp` feature): build with
# `cargo build --features otlp` to compile the exporter in. At runtime it
# stays inert until OTEL_EXPORTER_OTLP_ENDPOINT (or
# [server.diagnostics] otlp_endpoint) is set.
otlp = ["ephpm-server/otlp"]

[dependencies]
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
ephpm-config.workspace = true
ephpm-db.workspace = true
ephpm-kv.workspace = true
ephpm-php.workspace = true
ephpm-server.workspace = true
# mimalloc as the global allocator for the ephpm binary. Non-Windows only.
#
# Wins in workloads with many small, short-lived allocations (HTTP request
# frames, RESP command payloads, MySQL packet vecs, litewire query buffers) —
# the default system allocator has measurable contention under concurrent
# tokio task load. Default features only (no `secure` — that adds tag
# checks intended for adversarial-heap workloads at a real perf cost).
#
# Applied only at the binary crate level so downstream test/dev tooling
# (unit tests, xtask, doc builds) uses the standard allocator and doesn't
# introduce platform-specific surprises in CI.
#
# Not on Windows: mimalloc-sys builds its C with `/MD` (dynamic CRT) while
# the PHP SDK's static objects are `/MT`, and MSVC refuses to link the
# mismatch (LNK2038). The Windows allocator picture is also different —
# SEG_HEAP already reduces the contention mimalloc addresses on glibc — so
# Windows keeps the system allocator.
#
# tempfile is a runtime dependency, not just a test one: the generated
# php.ini is materialised into a private mkdtemp directory (see
# `run_with_config`), because a predictable path under a shared /tmp is
# attacker-plantable.
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
# `ephpm middleware` CLI: fetch + verify prebuilt middleware cdylibs from the
# ephpm/middleware GitHub releases. `ephpm-middleware` supplies the host ABI
# major for the download-time compatibility gate; `sha2` verifies the download
# against the release's SHA256SUMS before it is written to disk.
ephpm-middleware.workspace = true
sha2.workspace = true
serde = { workspace = true }
serde_json.workspace = true
# The HTTP client for the middleware CLI. `rustls-tls-webpki-roots-no-provider`
# (NOT `rustls-tls`): the latter implies reqwest's `__rustls-ring`, which links
# `ring` and reintroduces the multi-provider bug (#241). The `-no-provider`
# variant builds its `ClientConfig` from `CryptoProvider::get_default()`, so it
# rides the SAME aws-lc-rs provider the server uses — the CLI installs it via
# `ephpm_server::tls::install_default_crypto_provider()` before the first call.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-webpki-roots-no-provider",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
