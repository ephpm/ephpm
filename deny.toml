[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # rustls-pemfile unmaintained — transitive dep, awaiting upstream migration
    "RUSTSEC-2025-0134",
    # rustls-webpki cert-verification vulns — after bumping our own TLS stack
    # to rustls-webpki 0.103.13, these now match ONLY the old 0.102.8 still
    # pulled via opensrv-mysql 0.7.0 (latest) -> tokio-rustls 0.25 ->
    # rustls 0.22, a litewire transitive dep. opensrv-mysql uses rustls only
    # for server-side MySQL TLS, which does not exercise the name-constraint /
    # CRL verification paths these advisories concern. Drop once opensrv-mysql
    # moves to rustls 0.23 (or litewire replaces it).
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # proc-macro-error2 unmaintained — pulled transitively by
    # mysql-common-derive -> mysql_common -> mysql_async / opensrv-mysql.
    # Compile-time-only (proc macro), no runtime exposure. Awaiting
    # upstream migration to manyhow / proc-macro2-diagnostics.
    "RUSTSEC-2026-0173",
    # rustls TLS 1.3 handshake messages accepted at the wrong encryption
    # level. Low severity: the handshake transcript stays authenticated, so a
    # network attacker cannot alter or complete a handshake (upstream's own
    # assessment) — the practical effect is that certain handshake messages
    # could be sent in plaintext. The fix is rustls >= 0.23.45, which requires
    # a Rust newer than our MSRV 1.88 (force-pinned by the litewire dep), so
    # our own stack is capped at 0.23.43; opensrv-mysql's transitive 0.22.4
    # cannot move either. Drop once litewire raises MSRV (letting us reach
    # 0.23.45) and opensrv-mysql moves off rustls 0.22.
    "RUSTSEC-2026-0285",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # libbz2-rs-sys (pure-Rust bzip2 backend, pulled by vivacity's zip). The
    # bzip2/libbzip2 v1.0.6 license is a permissive BSD-style license.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["MIT"], name = "xtask", version = "*" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/ephpm/litewire.git"]
