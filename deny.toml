[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # rustls-pemfile unmaintained — transitive dep, awaiting upstream migration
    "RUSTSEC-2025-0134",
    # unsafe-libyaml unmaintained (repo archived; "no safe upgrade available").
    # Pulled only by serde_yaml_ng in ephpm-analyze, which parses one file: the
    # operator's own `.ephpm-analyze.yml`. It is an unmaintained notice, not a
    # vulnerability. The suggested replacement (serde-saphyr) needs Rust 1.89,
    # above our 1.88 MSRV, so migrating is a separate change. Remove this entry
    # when ephpm-analyze moves off serde_yaml_ng.
    "RUSTSEC-2024-0449",
    # zip 2.4.2 (pulled only by vivacity-core, the `ephpm composer` installer;
    # still `zip = "=2.4.2"` in vivacity 0.23.0): SUID/SGID bits kept on
    # extraction (0367), symlink targets outside the destination (0368),
    # permissions applied through symlinks (0369). All three are in zip's own
    # `ZipArchive::extract` / `ZipStreamReader::extract`, which vivacity never
    # calls: its `extract::extract_zip` walks entries with `by_index`, masks
    # stored modes to 0o777 (no SUID/SGID/sticky), rejects absolute and
    # escaping symlink targets and any entry written through a symlink the
    # archive created, and applies modes only to regular files and
    # directories. The fix is zip >= 9.0.0, which needs a vivacity release;
    # remove these entries when vivacity moves to it.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # zstd 0.13.3 / zstd-safe 7.2.4. Fixed only in zstd 0.14.3 / zstd-safe
    # 8.2.0, a breaking bump that chitchat
    # 0.10 and mysql_common 0.32 (via mysql_async 0.34 and the opensrv-mysql
    # fork) do not accept yet. mysql_common calls zstd solely to decode binlog
    # TRANSACTION_PAYLOAD events (src/binlog/events/transaction_payload_event.rs)
    # -- a replication client path neither the opensrv server nor ePHPm's
    # mysql_async client ever reaches (mysql_async's own `compression` option is
    # zlib only), as in litewire's deny.toml. None of the three is reachable; see
    # https://github.com/ephpm/ephpm/issues/648. Remove these entries when the
    # graph reaches the fixed versions.
    # - 0391: context reuse across streams in the `with_context` stream
    #   constructors. Nothing here uses them: ephpm-kv calls
    #   `encode_all`/`decode_all`, chitchat calls `bulk::compress_to_buffer` /
    #   `bulk::decompress_to_buffer` (a fresh context per call), and
    #   mysql_common's binlog decoder uses `Decoder::with_buffer`/`copy_decode`.
    "RUSTSEC-2026-0391",
    # - 0398: `Seekable::decompress`, behind zstd's `seekable` feature, which
    #   nothing in the graph enables.
    "RUSTSEC-2026-0398",
    # - 0403: a corrupt legacy frame through `stream::write::Decoder` /
    #   `DCtx::decompress_stream` into a `Vec`. The advisory exempts
    #   `decode_all`, `stream::read::Decoder` and the bulk API, which are the
    #   only decoders used here (and mysql_common's are binlog-only, above).
    "RUSTSEC-2026-0403",
    # tokio 1.53.1: `AsyncFd`'s safe constructors (`new`, `with_interest`,
    # `try_new`, `try_with_interest`) accept any `AsRawFd`, including a raw fd
    # the caller does not own. Fixed in 1.53.3, but vivacity (0.23.0, and
    # 0.24.0 too) pins `tokio = "=1.53.1"`. Nothing in the graph calls those
    # constructors: no ePHPm crate uses `AsyncFd`, tokio itself does not, and
    # the only dependency that does (aya's `AsyncPerfEventArray`) sits behind
    # aya's `async_tokio` feature, which is off. #648; remove when vivacity
    # relaxes its =1.53.1 tokio pin.
    "RUSTSEC-2026-0386",
    # RESOLVED (do not re-add): RUSTSEC-2026-0410 (zstd-sys wasm32 allocator
    # shim) is fixed by zstd-sys 2.1.2, which zstd-safe 7 accepts.
    # RESOLVED (do not re-add): RUSTSEC-2026-0173 (proc-macro-error2
    # unmaintained) left the graph with mysql-common-derive, once the
    # opensrv-mysql fork stopped enabling mysql_common's default features.
    # RESOLVED (do not re-add): RUSTSEC-2026-0285 (rustls TLS 1.3 handshake at
    # the wrong encryption level) and the rustls-webpki advisories 0049 / 0098 /
    # 0099 / 0104 are now fixed at the source, not ignored. opensrv-mysql is
    # patched to the aws-lc-rs fork on rustls >= 0.23.45 ([patch.crates-io] in
    # Cargo.toml), which removes rustls 0.22.4 and rustls-webpki 0.102.8 from the
    # graph and moves our own rustls line to 0.23.45. (The earlier "0.23.45 needs
    # a Rust newer than MSRV 1.88" note was wrong: rustls 0.23.45, tokio-rustls
    # 0.26, aws-lc-rs 1.18 and rustls-webpki 0.103.15 all declare rust-version
    # 1.71.) `cargo deny check advisories` matches none of these five.
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # libbz2-rs-sys (pure-Rust bzip2 backend, pulled by vivacity's zip). The
    # bzip2/libbzip2 v1.0.6 license is a permissive BSD-style license.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["MIT"], name = "xtask", version = "*" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
# A second SQLite C library in the binary is a correctness and performance
# bug, not just bloat. PHP's pdo_sqlite/sqlite3 link the PHP SDK's libsqlite3
# by symbol name, so any crate that compiles its own SQLite (libsqlite3-sys
# with `bundled`, i.e. rusqlite) silently takes over those sqlite3_* symbols.
# That happened through litewire-backend's default `rusqlite` feature: PHP ran
# on rusqlite's SQLite 3.46.0 with ENABLE_MEMORY_MANAGEMENT (a process-wide
# page-cache mutex that serialized threaded PHP) and DEFAULT_FOREIGN_KEYS=1.
# The embedded database engine is Turso (pure Rust) and needs neither.
deny = [
    { name = "libsqlite3-sys", reason = "a bundled SQLite shadows the PHP SDK's libsqlite3 that pdo_sqlite links against; see the comment above" },
    # Same failure with zlib. PHP's zlib extension and libzip link the PHP
    # SDK's libz.a by symbol name. libz-sys (flate2's `zlib` feature, which
    # mysql_common's default features turn on) compiles its own zlib when the
    # build host has no system zlib, with Z_SOLO: no default allocator, no gz*
    # API. Its inflate*/deflate* won the link, so gzopen(), compress.zlib://
    # and ZipArchive failed with Z_STREAM_ERROR in the v0.11.3 Docker image.
    # Rust code that needs deflate uses flate2's pure-Rust backend, which
    # exports no C symbols. crates/ephpm-php/tests/zlib_linkage.rs checks it.
    { name = "libz-sys", reason = "a bundled Z_SOLO zlib shadows the PHP SDK's libz.a that PHP's zlib extension and libzip link against; see the comment above" },
    { name = "libz-ng-sys", reason = "a bundled zlib-ng exports zlib symbols that shadow the PHP SDK's libz.a; see the libz-sys entry" },
    { name = "libz-rs-sys", reason = "exports C zlib symbols that shadow the PHP SDK's libz.a; see the libz-sys entry" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/ephpm/litewire.git",
    # ePHPm fork of opensrv-mysql 0.7.0 (RUSTSEC-2026-0285 fix; see
    # [patch.crates-io] in Cargo.toml). Remove when it returns to a crates.io source.
    "https://github.com/ephpm/opensrv-mysql.git",
    # ePHPm org mirror of Turso 0.8.3 + the page-1 allocation race fix (tag
    # v0.8.3-ephpm.1; upstream PR tursodatabase/turso#10117; see the turso
    # entries in [patch.crates-io] in Cargo.toml). Remove when a Turso release
    # carrying the fix is pinned from crates.io.
    "https://github.com/ephpm/turso.git",
]
