[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # rustls-pemfile unmaintained — transitive dep, awaiting upstream migration
    "RUSTSEC-2025-0134",
    # proc-macro-error2 unmaintained — pulled transitively by
    # mysql-common-derive -> mysql_common -> mysql_async / opensrv-mysql.
    # Compile-time-only (proc macro), no runtime exposure. Awaiting
    # upstream migration to manyhow / proc-macro2-diagnostics.
    "RUSTSEC-2026-0173",
    # RESOLVED (do not re-add): RUSTSEC-2026-0285 (rustls TLS 1.3 handshake at
    # the wrong encryption level) and the rustls-webpki advisories 0049 / 0098 /
    # 0099 / 0104 are now fixed at the source, not ignored. opensrv-mysql is
    # patched to the aws-lc-rs fork on rustls >= 0.23.45 ([patch.crates-io] in
    # Cargo.toml), which removes rustls 0.22.4 and rustls-webpki 0.102.8 from the
    # graph and moves our own rustls line to 0.23.45. (The earlier "0.23.45 needs
    # a Rust newer than MSRV 1.88" note was wrong: rustls 0.23.45, tokio-rustls
    # 0.26, aws-lc-rs 1.18 and rustls-webpki 0.103.15 all declare rust-version
    # 1.71.) `cargo deny check advisories` matches none of these five.
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # libbz2-rs-sys (pure-Rust bzip2 backend, pulled by vivacity's zip). The
    # bzip2/libbzip2 v1.0.6 license is a permissive BSD-style license.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["MIT"], name = "xtask", version = "*" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/ephpm/litewire.git",
    # ePHPm fork of opensrv-mysql 0.7.0 (RUSTSEC-2026-0285 fix; see
    # [patch.crates-io] in Cargo.toml). Remove when it returns to a crates.io source.
    "https://github.com/ephpm/opensrv-mysql.git",
]
